<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ENTIP Case Review</title>
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<header class="top">
  <a class="brand" href="#worklist" aria-label="ENTIP cases">
    <span class="mark" aria-hidden="true"></span>
    <span class="name">ENTIP</span>
  </a>
  <div class="viewtabs" id="viewtabs" role="tablist" aria-label="View">
    <button type="button" role="tab" data-view="clinician" aria-selected="true">Clinician</button>
    <button type="button" role="tab" data-view="researcher" aria-selected="false">Researcher</button>
  </div>
  <nav class="crumbs" id="crumbs" aria-label="Breadcrumb"></nav>
  <span class="grow"></span>
  <span class="ruo" title="Research use only. Not for diagnosis or patient management.">Research use only</span>
  <span class="mode" id="mode" hidden>Synthetic data</span>
  <button class="who" id="who" type="button" title="Name recorded on your marks"></button>
</header>
<main id="main" tabindex="-1"></main>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<script src="vendor/openseadragon/openseadragon.js"></script>
<script src="config.js"></script>
<script src="js/head.js"></script>
<script src="js/api.js"></script>
<script src="js/viewer.js"></script>
<script src="js/app.js"></script>
</body>
</html>
