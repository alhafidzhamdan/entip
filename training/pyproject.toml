[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "entip-train"
version = "0.1.0"
description = "ENTIP pillar 2: live per-feature training on frozen embeddings, plus gated retraining. Research use only."
license = "MIT"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",        # BSD-3-Clause
  "scikit-learn>=1.3",  # BSD-3-Clause
  "joblib>=1.3",        # BSD-3-Clause
]

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn>=0.27"]          # MIT, BSD-3-Clause
foundation = ["torch>=2.1", "timm>=1.0", "huggingface_hub>=0.20"]  # BSD-3-Clause, Apache-2.0, Apache-2.0 (weights: H-optimus-0, Apache-2.0)
xgboost = ["xgboost>=2.0"]                         # Apache-2.0
dev = ["pytest>=7", "httpx>=0.25"]                 # MIT, BSD-3-Clause

[project.scripts]
entip-train = "entip_train.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
