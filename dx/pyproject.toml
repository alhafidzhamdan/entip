[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "entip-dx"
version = "0.1.0"
description = "ENTIP AI glioma workflow step 5: WHO CNS5 rules engine and draft integrated report. Research use only."
readme = "README.md"
license = "LicenseRef-PolyForm-Noncommercial-1.0.0"  # see ../LICENSE.md
requires-python = ">=3.10"
dependencies = []  # standard library only

[project.optional-dependencies]
test = ["pytest>=8", "jsonschema>=4.18"]  # MIT, MIT

[project.scripts]
entip-dx = "entip_dx.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
